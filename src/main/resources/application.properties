spring.application.name=company-verification

spring.datasource.url=jdbc:postgresql://localhost:5432/company_verification_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging configuration
logging.level.com.example.company_verification=INFO
logging.file.name=logs/company-verification.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

spring.cache.cache-names=freeCompanies,premiumCompanies
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m